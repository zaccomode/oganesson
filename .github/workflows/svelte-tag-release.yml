name: Tag oganesson-svelte release

# The version in svelte/package.json is the decision; the tag is bookkeeping.
# When a commit lands on main that changes that version, and the
# oganesson-svelte CI workflow has passed on it, this tags that commit
# svelte-v<version> and starts svelte-release.yml from the tag. Cutting a
# release is therefore a pull request that bumps the version, and merging it is
# the approval. Publishing the draft release that comes out the other end stays
# manual, and is what puts the package on npm; see svelte/RELEASING.md.
on:
  workflow_run:
    # svelte.yml's `name`. Renaming that workflow means updating this.
    workflows: [oganesson-svelte]
    types: [completed]
    branches: [main]
  # For a version bump that this missed: one buried mid-way through a push of
  # several commits, where the commit CI ran on did not itself change the
  # version. Run it from main. It tags main's current head, and unlike the
  # automatic path it does not wait for CI, so check the head is green first.
  workflow_dispatch:

# Read-only by default; the job below asks for write access on its own, so
# that anything added to this file later starts from the narrow scope.
permissions:
  contents: read

# Two pushes to main finishing CI together must not both decide the tag is
# missing and both start a build.
concurrency:
  group: svelte-tag-release
  cancel-in-progress: false

jobs:
  tag:
    # `event == 'push'` because CI also runs on pull requests, and a pull
    # request whose head branch happens to be called main would otherwise pass
    # the branch filter above.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch svelte-release.yml
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI actually passed on, not whatever main has moved to
          # since. Depth 2 so the parent's package.json can be read.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Tag the commit if it bumps the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MANIFEST: svelte/package.json
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not ${{ github.ref_name }}. It tags the" \
                 "commit it runs on, and releases come from main."
            exit 1
          fi

          version="$(jq -r .version "$MANIFEST")"
          tag="svelte-v$version"

          # A commit that leaves the version alone is an ordinary merge, not a
          # release. Checking for the change, rather than only for a missing
          # tag, is what lets a bad release's tag be deleted without the next
          # unrelated merge re-creating it on a different commit. The first
          # parent is main as it was before this commit, merge commit or not.
          #
          # The one exception is the very first release: the package started
          # life at 0.1.0, so there is no bump to see, and while no svelte-v*
          # tag exists at all, the current version is released.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            previous="$(git show "HEAD^1:$MANIFEST" | jq -r .version)"
            if [ "$previous" = "$version" ]; then
              if [ -n "$(gh api "repos/$REPO/git/matching-refs/tags/svelte-v" --jq '.[].ref')" ]; then
                echo "The version is still $version; nothing to release."
                exit 0
              fi
              echo "No oganesson-svelte release exists yet, so $version is the first."
            else
              echo "The version moved from $previous to $version."
            fi
          fi

          # Someone may have pushed the tag by hand, in which case
          # svelte-release.yml is already running from that push.
          if gh api "repos/$REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists, so its release has already been started."
            exit 0
          fi

          sha="$(git rev-parse HEAD)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" > /dev/null
          echo "Tagged $sha as $tag."

          # A ref created with GITHUB_TOKEN does not fire `push: tags`, so the
          # release has to be started explicitly; workflow_dispatch is the one
          # event that token is allowed to trigger. Dispatching on the tag ref,
          # rather than on main with the tag as an input, keeps every release
          # run on a svelte-v* ref, which is what the `release` environment
          # admits.
          #
          # If this ever moves to an App token or a PAT, the tag above *will*
          # fire `push: tags`, and this line must go, or every release builds
          # twice and the second run fails creating a release that exists.
          gh workflow run svelte-release.yml --repo "$REPO" --ref "$tag"
          echo "Started the release workflow for $tag. It will leave a draft to check and publish."
