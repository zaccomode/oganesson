name: Publish oganesson-svelte to npm

# Publishing a svelte-v* GitHub release is the approval to release; this then
# puts that release's tarball on npm. It publishes the exact file attached to
# the release rather than rebuilding it, so what gets installed is what was
# checked in the draft.
#
# There is no token: npm trusts this workflow file, in this repository, in the
# `release` environment, through a trusted publisher set up on the package
# (see svelte/RELEASING.md). Renaming this file means updating that.
on:
  release:
    # Full releases, and pre-releases when they become full releases, never
    # pre-releases.
    types: [released]
  # To retry a failed publish. Run it on the release's tag: the `release`
  # environment only admits svelte-v* tags.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Other packages may release from this repository one day, under their
    # own tag prefixes.
    if: startsWith(github.event.release.tag_name || github.ref_name, 'svelte-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Lets npm request the GitHub identity token it exchanges with the
      # registry, and sign the provenance statement.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the release's tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'oganesson-svelte-*.tgz' --dir "$RUNNER_TEMP/release"
          ls "$RUNNER_TEMP/release"

      # The first version is published by hand (npm only lets a trusted
      # publisher be added to a package that exists), and a retry may follow a
      # publish that did go through, so a version npm already has is a no-op.
      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#svelte-v}"
          # `npm view` exits 0 with no output for a version the package lacks.
          if [ -n "$(npm view "oganesson-svelte@$version" version 2>/dev/null)" ]; then
            echo "oganesson-svelte@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "$RUNNER_TEMP"/release/oganesson-svelte-*.tgz --access public --provenance
