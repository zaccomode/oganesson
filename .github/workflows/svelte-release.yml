name: oganesson-svelte release

# A svelte-v* tag is the trigger, and the tag has to agree with the version in
# svelte/package.json. This builds and tests the package, packs it, and leaves
# a draft GitHub release with the tarball attached. Publishing that draft is
# what puts the tarball on npm; see svelte-publish-npm.yml.
#
# Ordinarily nobody pushes that tag by hand: svelte-tag-release.yml creates it
# when a version bump lands on main, then dispatches this workflow on it. A tag
# pushed by hand still starts a release through `push` below.
on:
  push:
    tags: ['svelte-v*']
  # How svelte-tag-release.yml starts this, because a tag created with
  # GITHUB_TOKEN does not fire `push`. Also available by hand to re-run a
  # release: choose the tag in the ref picker.
  workflow_dispatch:

# Read-only by default; only the `draft` job asks for write access, so that
# anything added to this file later starts from the narrow scope.
permissions:
  contents: read

jobs:
  # Everything that runs repository or dependency code (npm ci runs every
  # dependency's install scripts, then lint, svelte-check and the tests) runs
  # here, with a read-only token. A compromised dependency can break the build
  # but cannot touch releases.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: svelte
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the package
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ] || [[ "$tag" != svelte-v* ]]; then
            echo "::error::This workflow builds a svelte-v* tag, but it was run against" \
                 "${{ github.ref_type }} $tag. Re-run it from Actions and choose the" \
                 "release tag in the ref picker."
            exit 1
          fi
          version="$(jq -r .version package.json)"
          if [ "$tag" != "svelte-v$version" ]; then
            echo "::error::Tag $tag does not match svelte/package.json's version" \
                 "$version. Bump the version, then re-tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: svelte/package-lock.json

      # The same checks CI runs, so a tag pushed by hand, which skips CI on
      # main, still cannot release something broken.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npm test

      # prepack runs svelte-package and publint, so this is the build too.
      # The tarball goes on the release, and svelte-publish-npm.yml publishes
      # that exact file rather than rebuilding it.
      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --pack-destination "$RUNNER_TEMP/dist"
          tarball="$RUNNER_TEMP/dist/oganesson-svelte-$VERSION.tgz"
          ls "$RUNNER_TEMP/dist"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/dist/oganesson-svelte-${{ steps.check.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It checks out nothing and installs
  # nothing: it downloads the tarball `build` made, and creates the draft.
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      # Drafts are only visible with write access, so this check lives here
      # rather than in `build`.
      - name: Check the release doesn't exist
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists. Delete it in the" \
                 "Releases UI first if you mean to rebuild it."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: ${{ runner.temp }}/dist

      # The artifact passed between jobs, so check it is the file `build` hashed.
      # svelte-publish-npm.yml checks the tarball against this line again
      # before publishing; keep it in the notes.
      - name: Create the draft release
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/dist/oganesson-svelte-$VERSION.tgz"
          echo "$SHA256  $tarball" | sha256sum --check
          gh release create "$GITHUB_REF_NAME" "$tarball" \
            --repo "${{ github.repository }}" \
            --draft --title "oganesson-svelte $VERSION" \
            --notes "SHA-256 of \`oganesson-svelte-$VERSION.tgz\`: \`$SHA256\`" \
            --generate-notes \
            --verify-tag
