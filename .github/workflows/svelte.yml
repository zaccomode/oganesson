name: oganesson-svelte

on:
  push:
    branches: [main]
    paths: ['svelte/**', '.github/workflows/svelte.yml']
  pull_request:
    paths: ['svelte/**', '.github/workflows/svelte.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: svelte

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the same Node major as svelte-release.yml and engines.node. A
      # change that passes here then builds the same way when it's released.
      # Move all three together.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: svelte/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
